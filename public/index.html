<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Entry</title>
<style>
  :root {
    --ink: #1c1f1a;
    --paper: #f6f5ef;
    --line: #cfccc0;
    --moss: #4c6b4f;
    --moss-dark: #3a5240;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  p.sub {
    margin: 0 0 32px;
    color: #6b6a5f;
    font-size: 0.95rem;
  }

  form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1 1 140px;
  }

  label {
    font-size: 0.8rem;
    color: #6b6a5f;
  }

  input {
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    font-size: 0.95rem;
    color: var(--ink);
  }

  input:focus {
    outline: 2px solid var(--moss);
    outline-offset: 1px;
    border-color: var(--moss);
  }

  input:invalid:not(:placeholder-shown) {
    border-color: #b3564f;
  }

  button.save {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 6px;
    background: var(--moss);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  button.save:hover { background: var(--moss-dark); }
  button.save:active { transform: translateY(1px); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }

  thead th {
    text-align: left;
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 2px solid var(--ink);
  }

  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
  }

  tbody tr:hover { background: #eeece0; }

  .empty-row td {
    text-align: center;
    color: #9a988c;
    padding: 24px 10px;
    font-style: italic;
  }

  .remove-btn {
    border: none;
    background: none;
    color: #b3564f;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .remove-btn:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Add a record</h1>
  <p class="sub">Fill in the fields and press save to add a row to the table.</p>

  <form id="entry-form">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Jane Doe" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="jane@example.com" required>
    </div>
    <div class="field" style="flex: 0 1 90px;">
      <label for="age">Age</label>
      <input type="number" id="age" placeholder="21" min="0" max="120" required>
    </div>
    <button type="submit" class="save" title="Save" aria-label="Save entry">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
        <path d="M17 21v-8H7v8"></path>
        <path d="M7 3v5h8"></path>
      </svg>
    </button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="records-body">
      <tr class="empty-row" id="empty-row">
        <td colspan="4">No records yet</td>
      </tr>
    </tbody>
  </table>
</main>

<script>
  const form = document.getElementById('entry-form');
  const tbody = document.getElementById('records-body');
  const emptyRow = document.getElementById('empty-row');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const age = document.getElementById('age').value.trim();

    if (!name || !email || !age) return;

    if (emptyRow.parentNode) emptyRow.remove();

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${escapeHtml(name)}</td>
      <td>${escapeHtml(email)}</td>
      <td>${escapeHtml(age)}</td>
      <td><button class="remove-btn" type="button">remove</button></td>
    `;
    row.querySelector('.remove-btn').addEventListener('click', function () {
      row.remove();
      if (!tbody.children.length) tbody.appendChild(emptyRow);
    });

    tbody.appendChild(row);
    form.reset();
    document.getElementById('name').focus();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
